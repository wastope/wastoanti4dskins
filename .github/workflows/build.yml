name: Build & Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Read version
        id: version
        run: |
          VERSION=$(./gradlew properties -q --no-daemon | grep '^version:' | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WastoAnti4DSkins-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}
          path: build/libs/*.jar

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WastoAnti4DSkins ${{ steps.version.outputs.version }} (${{ steps.version.outputs.sha }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
          files: build/libs/*.jar
